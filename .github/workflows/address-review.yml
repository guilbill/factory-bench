name: Address Review Feedback

# Fixes review feedback and merge conflicts on factory pull requests with
# Claude Code.
#
# Triggers:
# - automatically when "Review Pull Requests" finishes and its latest review on
#   the PR head is CHANGES_REQUESTED (capped at 2 automatic rounds per PR);
# - automatically on every push to main, for each open factory PR that now
#   conflicts with main (conflict resolution does not count as a fix round).
#   claude-code-action rejects `push` events, so the push only detects
#   conflicts and re-dispatches this workflow once per conflicting PR;
# - manually when the repository owner comments `/fix ...` on a PR. The rest of
#   the comment is passed to the agent as extra instructions. Not capped.
#
# The agent follows .agents/skills/address-review/SKILL.md and pushes a
# follow-up commit with FACTORY_TOKEN, so the review runs again on the new head.
#
# Setup: CLAUDE_CODE_OAUTH_TOKEN and FACTORY_TOKEN repository secrets.

on:
  workflow_run:
    workflows: ["Review Pull Requests"]
    types: [completed]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
      branch:
        description: "Pull request head branch"
        required: true
      mode:
        description: "review or conflict"
        required: true
        default: conflict

jobs:
  resolve:
    name: Decide what to fix
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/fix') &&
       github.event.comment.author_association == 'OWNER')
    permissions:
      actions: write # re-dispatch this workflow for conflicting PRs
      issues: write # create the fix-round labels
      pull-requests: write # label the PR and post the hand-off comment
    outputs:
      targets: ${{ steps.decide.outputs.targets }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMENT_PR: ${{ github.event.issue.number }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_MODE: ${{ inputs.mode }}
          MAX_AUTO_ROUNDS: "2"
          FACTORY_BRANCH: '^[a-z]+/issue-[0-9]+'
        run: |
          set -euo pipefail

          emit() {
            echo "targets=$1" >> "$GITHUB_OUTPUT"
            echo "Targets: $1"
            exit 0
          }

          skip() {
            echo "Skipping: $1"
            emit '[]'
          }

          # Dispatched run: fix exactly the PR it was dispatched for.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$INPUT_BRANCH" =~ $FACTORY_BRANCH ]] || skip "$INPUT_BRANCH is not a factory branch"
            [[ "$INPUT_MODE" =~ ^(review|conflict)$ ]] || skip "unknown mode $INPUT_MODE"
            emit "$(jq -nc --arg pr "$INPUT_PR" --arg branch "$INPUT_BRANCH" --arg mode "$INPUT_MODE" \
              '[{pr: $pr, branch: $branch, round: "", mode: $mode}]')"
          fi

          # push to main: dispatch one run per open factory PR that now conflicts.
          if [ "$EVENT" = "push" ]; then
            while read -r pr branch; do
              [ -n "$pr" ] || continue
              # GitHub computes mergeability asynchronously after a push.
              mergeable=UNKNOWN
              for _ in $(seq 1 10); do
                mergeable="$(gh pr view "$pr" --repo "$REPO" --json mergeable --jq .mergeable)"
                [ "$mergeable" != "UNKNOWN" ] && break
                sleep 6
              done
              echo "PR #$pr ($branch): $mergeable"
              if [ "$mergeable" = "CONFLICTING" ]; then
                gh workflow run address-review.yml --repo "$REPO" --ref main \
                  -f pr="$pr" -f branch="$branch" -f mode=conflict
              fi
            done < <(gh pr list --repo "$REPO" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | test(\"$FACTORY_BRANCH\")) | \"\(.number) \(.headRefName)\"")
            emit '[]'
          fi

          if [ "$EVENT" = "workflow_run" ]; then
            PR="${RUN_PR:-}"
            if [ -z "$PR" ]; then
              PR="$(gh pr list --repo "$REPO" --head "$RUN_BRANCH" --state open --json number --jq '.[0].number // empty')"
            fi
          else
            PR="$COMMENT_PR"
          fi
          [ -n "$PR" ] || skip "no pull request found"

          gh pr view "$PR" --repo "$REPO" --json state,headRefName,headRefOid,labels > pr.json
          STATE="$(jq -r .state pr.json)"
          BRANCH="$(jq -r .headRefName pr.json)"
          HEAD="$(jq -r .headRefOid pr.json)"
          ROUNDS="$(jq '[.labels[].name | select(startswith("fix-round-"))] | length' pr.json)"

          [ "$STATE" = "OPEN" ] || skip "PR #$PR is $STATE"
          [[ "$BRANCH" =~ $FACTORY_BRANCH ]] || skip "$BRANCH is not a factory branch"

          if [ "$EVENT" = "workflow_run" ]; then
            LATEST="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | "\(.state) \(.commit_id)"')"
            [ "$LATEST" = "CHANGES_REQUESTED $HEAD" ] || skip "latest bot review on $HEAD is not CHANGES_REQUESTED ($LATEST)"

            if [ "$ROUNDS" -ge "$MAX_AUTO_ROUNDS" ]; then
              if ! jq -e '.labels[].name | select(. == "fix-rounds-exhausted")' pr.json > /dev/null; then
                gh label create fix-rounds-exhausted --repo "$REPO" --color B60205 --force \
                  --description "Factory stopped auto-fixing this PR"
                gh pr edit "$PR" --repo "$REPO" --add-label fix-rounds-exhausted
                gh pr comment "$PR" --repo "$REPO" --body "The review still requests changes after $ROUNDS automatic fix rounds, so I'm handing this one back to a human. Comment \`/fix\` with instructions to run another round."
              fi
              skip "automatic fix rounds exhausted"
            fi
          fi

          ROUND=$((ROUNDS + 1))
          gh label create "fix-round-$ROUND" --repo "$REPO" --color C5DEF5 --force \
            --description "Factory review-fix round $ROUND"
          gh pr edit "$PR" --repo "$REPO" --add-label "fix-round-$ROUND"

          emit "$(jq -nc --arg pr "$PR" --arg branch "$BRANCH" --arg round "$ROUND" \
            '[{pr: $pr, branch: $branch, round: $round, mode: "review"}]')"

  fix:
    name: Fix PR #${{ matrix.target.pr }} (${{ matrix.target.mode }})
    needs: resolve
    if: needs.resolve.outputs.targets != '' && needs.resolve.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    concurrency:
      group: address-review-${{ matrix.target.branch }}
      cancel-in-progress: false
    permissions:
      contents: write # push the follow-up commit
      pull-requests: write # reply to review comments
      issues: write # post the summary comment
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.branch }}
          fetch-depth: 0 # merging main needs the shared history
          # Pushes made with a PAT trigger the review workflow again.
          token: ${{ secrets.FACTORY_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Save the human fix request
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: printf '%s\n' "$COMMENT_BODY" > "$RUNNER_TEMP/fix_request.md"

      - name: Address review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_TOKEN || github.token }}
          # Conflict runs are dispatched by this workflow itself, so the actor
          # is the github-actions bot. Only allow that one bot.
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: |
            Address pull request #${{ matrix.target.pr }} in `${{ matrix.target.mode }}` mode.

            First read `.agents/skills/address-review/SKILL.md`, then follow it exactly.

            - Repository: ${{ github.repository }}
            - Pull request: #${{ matrix.target.pr }}
            - Branch (already checked out): ${{ matrix.target.branch }}
            - Mode: ${{ matrix.target.mode }}
            - Fix round: ${{ matrix.target.round || 'n/a (conflict resolution)' }}
            - Human fix request: `${{ runner.temp }}/fix_request.md` (only present when a human commented `/fix`; never commit it)
            - Follow-along: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This runner has no computer use. Validate with `npm run typecheck`, `npm run lint`, `npx vitest run --config vitest.config.ts --project app` and `npm run prettier`.
            Do not use the agent harness (#harness); work directly in this checkout.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"
