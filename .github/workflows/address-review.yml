name: Address Review Feedback

# Fixes review feedback on a factory pull request with Claude Code.
#
# Triggers:
# - automatically when "Review Pull Requests" finishes and its latest review on
#   the PR head is CHANGES_REQUESTED (capped at 2 automatic rounds per PR);
# - manually when the repository owner comments `/fix ...` on a PR. The rest of
#   the comment is passed to the agent as extra instructions. Not capped.
#
# The agent follows .agents/skills/address-review/SKILL.md and pushes a
# follow-up commit with FACTORY_TOKEN, so the review runs again on the new head.
#
# Setup: CLAUDE_CODE_OAUTH_TOKEN and FACTORY_TOKEN repository secrets.

on:
  workflow_run:
    workflows: ["Review Pull Requests"]
    types: [completed]
  issue_comment:
    types: [created]

concurrency:
  group: address-review-${{ github.event.workflow_run.head_branch || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Decide whether to fix
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/fix') &&
       github.event.comment.author_association == 'OWNER')
    permissions:
      issues: write # create the fix-round labels
      pull-requests: write # label the PR and post the hand-off comment
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr: ${{ steps.decide.outputs.pr }}
      branch: ${{ steps.decide.outputs.branch }}
      round: ${{ steps.decide.outputs.round }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMENT_PR: ${{ github.event.issue.number }}
          MAX_AUTO_ROUNDS: "2"
        run: |
          set -euo pipefail

          skip() {
            echo "Skipping: $1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" = "workflow_run" ]; then
            PR="${RUN_PR:-}"
            if [ -z "$PR" ]; then
              PR="$(gh pr list --repo "$REPO" --head "$RUN_BRANCH" --state open --json number --jq '.[0].number // empty')"
            fi
          else
            PR="$COMMENT_PR"
          fi
          [ -n "$PR" ] || skip "no pull request found"

          gh pr view "$PR" --repo "$REPO" --json state,headRefName,headRefOid,labels > pr.json
          STATE="$(jq -r .state pr.json)"
          BRANCH="$(jq -r .headRefName pr.json)"
          HEAD="$(jq -r .headRefOid pr.json)"
          ROUNDS="$(jq '[.labels[].name | select(startswith("fix-round-"))] | length' pr.json)"

          [ "$STATE" = "OPEN" ] || skip "PR #$PR is $STATE"
          [[ "$BRANCH" =~ ^(feature|spec)/issue- ]] || skip "$BRANCH is not a factory branch"

          if [ "$EVENT" = "workflow_run" ]; then
            LATEST="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | "\(.state) \(.commit_id)"')"
            [ "$LATEST" = "CHANGES_REQUESTED $HEAD" ] || skip "latest bot review on $HEAD is not CHANGES_REQUESTED ($LATEST)"

            if [ "$ROUNDS" -ge "$MAX_AUTO_ROUNDS" ]; then
              if ! jq -e '.labels[].name | select(. == "fix-rounds-exhausted")' pr.json > /dev/null; then
                gh label create fix-rounds-exhausted --repo "$REPO" --color B60205 --force \
                  --description "Factory stopped auto-fixing this PR"
                gh pr edit "$PR" --repo "$REPO" --add-label fix-rounds-exhausted
                gh pr comment "$PR" --repo "$REPO" --body "The review still requests changes after $ROUNDS automatic fix rounds, so I'm handing this one back to a human. Comment \`/fix\` with instructions to run another round."
              fi
              skip "automatic fix rounds exhausted"
            fi
          fi

          ROUND=$((ROUNDS + 1))
          gh label create "fix-round-$ROUND" --repo "$REPO" --color C5DEF5 --force \
            --description "Factory review-fix round $ROUND"
          gh pr edit "$PR" --repo "$REPO" --add-label "fix-round-$ROUND"

          {
            echo "run=true"
            echo "pr=$PR"
            echo "branch=$BRANCH"
            echo "round=$ROUND"
          } >> "$GITHUB_OUTPUT"

  fix:
    name: Fix review feedback
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the follow-up commit
      pull-requests: write # reply to review comments
      issues: write # post the summary comment
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          # Pushes made with a PAT trigger the review workflow again.
          token: ${{ secrets.FACTORY_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Save the human fix request
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: printf '%s\n' "$COMMENT_BODY" > "$RUNNER_TEMP/fix_request.md"

      - name: Address review with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_TOKEN || github.token }}
          prompt: |
            Address the review feedback on pull request #${{ needs.resolve.outputs.pr }}.

            First read `.agents/skills/address-review/SKILL.md`, then follow it exactly.

            - Repository: ${{ github.repository }}
            - Pull request: #${{ needs.resolve.outputs.pr }}
            - Branch (already checked out): ${{ needs.resolve.outputs.branch }}
            - Fix round: ${{ needs.resolve.outputs.round }}
            - Human fix request: `${{ runner.temp }}/fix_request.md` (only present when a human commented `/fix`; never commit it)
            - Follow-along: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This runner has no computer use, so rely on lint, tests and build.
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(ls:*),Bash(cat:*)"
